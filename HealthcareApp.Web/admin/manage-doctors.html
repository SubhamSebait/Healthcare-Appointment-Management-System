<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Doctors — Healthcare App</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-logo"><div class="logo-icon">🏥</div><span>Healthcare<br>App</span></div>
      <div class="sidebar-user">
        <div class="user-name" id="sidebar-name">Loading...</div>
        <div class="user-role">Admin</div>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html"              class="nav-item"><span class="icon">🏠</span> Dashboard</a>
        <a href="manage-doctors.html"         class="nav-item active"><span class="icon">👨‍⚕️</span> Manage Doctors</a>
        <a href="manage-specializations.html" class="nav-item"><span class="icon">🩺</span> Specializations</a>
        <a href="patients.html"               class="nav-item"><span class="icon">👥</span> Patients</a>
        <a href="appointments.html"           class="nav-item"><span class="icon">📅</span> All Appointments</a>
      </nav>
      <div class="sidebar-footer"><button class="btn-logout" onclick="logout()">🚪 Logout</button></div>
    </aside>

    <div class="main-content">
      <div class="topbar">
        <div><h2>Manage Doctors</h2><div class="breadcrumb">Add, edit, or remove doctors</div></div>
        <button class="btn btn-primary" onclick="openAddModal()">+ Add Doctor</button>
      </div>
      <div class="content-area">
        <div class="card">
          <div class="card-body" id="doctors-container">
            <div class="loading">Loading doctors...</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Add/Edit Doctor Modal -->
  <div class="modal-overlay" id="doctor-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title">Add Doctor</h3>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div id="modal-alert" class="alert alert-danger hidden"></div>
      <form id="doctor-form">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="d-name" class="form-control" placeholder="Dr. Full Name" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="d-email" class="form-control" placeholder="doctor@email.com">
          </div>
          <div class="form-group">
            <label>Phone</label>
            <input type="tel" id="d-phone" class="form-control" placeholder="10 digits">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Specialization</label>
            <select id="d-spec" class="form-control" required></select>
          </div>
          <div class="form-group" id="password-group">
            <label>Password</label>
            <input type="password" id="d-password" class="form-control" placeholder="Min 6 chars">
          </div>
        </div>
        <div class="form-group">
          <label>Bio</label>
          <textarea id="d-bio" class="form-control" rows="2" placeholder="Brief bio / qualifications"></textarea>
        </div>
      </form>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" id="btn-save" onclick="saveDoctor()">Save</button>
      </div>
    </div>
  </div>

  <!-- Delete Confirm Modal -->
  <div class="modal-overlay" id="delete-modal">
    <div class="modal">
      <div class="modal-header"><h3>Delete Doctor</h3><button class="modal-close" onclick="closeDeleteModal()">✕</button></div>
      <p>Are you sure you want to delete <strong id="delete-name"></strong>? This will also remove their user account.</p>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeDeleteModal()">Cancel</button>
        <button class="btn btn-danger" id="btn-delete" onclick="confirmDelete()">Delete</button>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script>
    requireAuth('Admin');
    setupSidebar();

    let specializations = [];
    let editingDoctorId = null;
    let deletingDoctorId = null;

    async function init() {
        specializations = await Specializations.getAll();
        const sel = document.getElementById('d-spec');
        specializations.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s.id;
            opt.textContent = s.name;
            sel.appendChild(opt);
        });
        await loadDoctors();
    }

    async function loadDoctors() {
        const container = document.getElementById('doctors-container');
        try {
            const doctors = await Admin.getDoctors();
            if (doctors.length === 0) {
                container.innerHTML = `<div class="empty-state"><div class="icon">👨‍⚕️</div><h3>No doctors yet</h3><p>Click "Add Doctor" to get started.</p></div>`;
                return;
            }
            container.innerHTML = `
              <div class="table-container">
                <table>
                  <thead><tr><th>#</th><th>Name</th><th>Specialization</th><th>Phone</th><th>Bio</th><th>Actions</th></tr></thead>
                  <tbody>
                    ${doctors.map((d, i) => `
                      <tr>
                        <td>${i+1}</td>
                        <td><strong>${d.fullName}</strong></td>
                        <td>${d.specializationName}</td>
                        <td>${d.phone}</td>
                        <td style="font-size:0.8rem; color:var(--text-muted); max-width:200px">${d.bio || '-'}</td>
                        <td>
                          <div class="flex gap-1">
                            <button class="btn btn-sm btn-secondary" onclick="openEditModal(${d.id}, '${d.fullName}', ${d.specializationId}, '${d.phone}', \`${(d.bio||'').replace(/`/g,"'")}\`)">Edit</button>
                            <button class="btn btn-sm btn-danger"    onclick="openDeleteModal(${d.id}, '${d.fullName}')">Delete</button>
                          </div>
                        </td>
                      </tr>`).join('')}
                  </tbody>
                </table>
              </div>`;
        } catch (err) {
            container.innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
        }
    }

    function openAddModal() {
        editingDoctorId = null;
        document.getElementById('modal-title').textContent = 'Add Doctor';
        document.getElementById('doctor-form').reset();
        document.getElementById('modal-alert').classList.add('hidden');
        document.getElementById('password-group').style.display = '';
        document.getElementById('d-password').required = true;
        document.getElementById('doctor-modal').classList.add('open');
    }

    function openEditModal(id, name, specId, phone, bio) {
        editingDoctorId = id;
        document.getElementById('modal-title').textContent = 'Edit Doctor';
        document.getElementById('d-name').value  = name;
        document.getElementById('d-phone').value = phone;
        document.getElementById('d-bio').value   = bio;
        document.getElementById('d-spec').value  = specId;
        document.getElementById('d-email').value = '';
        document.getElementById('modal-alert').classList.add('hidden');
        document.getElementById('password-group').style.display = 'none';
        document.getElementById('d-password').required = false;
        document.getElementById('doctor-modal').classList.add('open');
    }

    function closeModal() {
        document.getElementById('doctor-modal').classList.remove('open');
        editingDoctorId = null;
    }

    async function saveDoctor() {
        const alert = document.getElementById('modal-alert');
        const btn   = document.getElementById('btn-save');
        alert.classList.add('hidden');
        btn.disabled = true;
        btn.textContent = 'Saving...';

        try {
            if (editingDoctorId) {
                await Admin.updateDoctor(editingDoctorId, {
                    fullName:         document.getElementById('d-name').value,
                    specializationId: parseInt(document.getElementById('d-spec').value),
                    phone:            document.getElementById('d-phone').value,
                    bio:              document.getElementById('d-bio').value,
                });
            } else {
                await Admin.addDoctor({
                    fullName:         document.getElementById('d-name').value,
                    email:            document.getElementById('d-email').value,
                    password:         document.getElementById('d-password').value,
                    specializationId: parseInt(document.getElementById('d-spec').value),
                    phone:            document.getElementById('d-phone').value,
                    bio:              document.getElementById('d-bio').value,
                });
            }
            showToast(editingDoctorId ? 'Doctor updated.' : 'Doctor added.', 'success');
            closeModal();
            await loadDoctors();
        } catch (err) {
            alert.textContent = err.message;
            alert.classList.remove('hidden');
        } finally {
            btn.disabled = false;
            btn.textContent = 'Save';
        }
    }

    function openDeleteModal(id, name) {
        deletingDoctorId = id;
        document.getElementById('delete-name').textContent = name;
        document.getElementById('delete-modal').classList.add('open');
    }
    function closeDeleteModal() {
        deletingDoctorId = null;
        document.getElementById('delete-modal').classList.remove('open');
    }
    async function confirmDelete() {
        if (!deletingDoctorId) return;
        const btn = document.getElementById('btn-delete');
        btn.disabled = true;
        btn.textContent = 'Deleting...';
        try {
            await Admin.deleteDoctor(deletingDoctorId);
            showToast('Doctor deleted.', 'info');
            closeDeleteModal();
            await loadDoctors();
        } catch (err) {
            showToast(err.message, 'error');
        } finally {
            btn.disabled = false;
            btn.textContent = 'Delete';
        }
    }

    init();
  </script>
</body>
</html>
