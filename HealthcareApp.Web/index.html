<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Healthcare Appointment System</title>
  <meta name="description" content="Login to Healthcare Appointment Management System">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-icon">🏥</div>
        <h1>Healthcare Appointment System</h1>
        <p>BTech College Project</p>
      </div>

      <div id="alert-box" class="alert alert-danger hidden"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
        </div>
        <button type="submit" id="btn-login" class="btn btn-primary btn-full" style="margin-top:0.5rem">
          Sign In
        </button>
      </form>

      <p class="text-center mt-2 text-muted">
        New patient? <a href="register.html">Register here</a>
      </p>

      <div style="margin-top:1.5rem; padding-top:1rem; border-top:1px solid var(--border);">
        <p class="text-muted text-center mb-1" style="font-size:0.8rem; font-weight:600">SAMPLE CREDENTIALS</p>
        <div style="display:grid; gap:0.35rem; font-size:0.78rem; color:var(--text-muted);">
          <div>🔑 <strong>Admin:</strong> admin@healthcare.com / Admin@123</div>
          <div>👨‍⚕️ <strong>Doctor:</strong> arjun@healthcare.com / Doctor@123</div>
          <div>👤 <strong>Patient:</strong> rahul@patient.com / Patient@123</div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    // Redirect if already logged in
    if (getToken()) {
        const role = getRole();
        if (role === 'Admin')   window.location.href = '/admin/dashboard.html';
        else if (role === 'Doctor')  window.location.href = '/doctor/dashboard.html';
        else                         window.location.href = '/patient/dashboard.html';
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn     = document.getElementById('btn-login');
        const alertBox = document.getElementById('alert-box');
        alertBox.classList.add('hidden');
        btn.textContent = 'Signing in...';
        btn.disabled = true;

        try {
            const data = await Auth.login(
                document.getElementById('email').value,
                document.getElementById('password').value
            );
            saveAuth(data);
            // Redirect by role
            if (data.role === 'Admin')  window.location.href = '/admin/dashboard.html';
            else if (data.role === 'Doctor') window.location.href = '/doctor/dashboard.html';
            else                              window.location.href = '/patient/dashboard.html';
        } catch (err) {
            alertBox.textContent = err.message;
            alertBox.classList.remove('hidden');
            btn.textContent = 'Sign In';
            btn.disabled = false;
        }
    });
  </script>
</body>
</html>
