<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Healthcare Appointment System</title>
  <meta name="description" content="Register as a new patient">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card" style="max-width:480px">
      <div class="auth-logo">
        <div class="logo-icon">🏥</div>
        <h1>Create Patient Account</h1>
        <p>Register to book appointments</p>
      </div>

      <div id="alert-box" class="alert alert-danger hidden"></div>

      <form id="register-form">
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" class="form-control" placeholder="Your full name" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" class="form-control" placeholder="10-digit number">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" class="form-control" placeholder="Min 6 characters" required>
          </div>
          <div class="form-group">
            <label for="dob">Date of Birth</label>
            <input type="date" id="dob" class="form-control">
          </div>
        </div>
        <button type="submit" id="btn-register" class="btn btn-primary btn-full" style="margin-top:0.5rem">
          Create Account
        </button>
      </form>

      <p class="text-center mt-2 text-muted">
        Already have an account? <a href="index.html">Sign in</a>
      </p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    if (getToken()) window.location.href = '/patient/dashboard.html';

    document.getElementById('register-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn      = document.getElementById('btn-register');
        const alertBox = document.getElementById('alert-box');
        alertBox.classList.add('hidden');
        btn.textContent = 'Creating account...';
        btn.disabled = true;

        const dto = {
            fullName:    document.getElementById('fullName').value,
            email:       document.getElementById('email').value,
            password:    document.getElementById('password').value,
            phone:       document.getElementById('phone').value || null,
            dateOfBirth: document.getElementById('dob').value || null,
        };

        try {
            const data = await Auth.register(dto);
            saveAuth(data);
            window.location.href = '/patient/dashboard.html';
        } catch (err) {
            alertBox.textContent = err.message;
            alertBox.classList.remove('hidden');
            btn.textContent = 'Create Account';
            btn.disabled = false;
        }
    });
  </script>
</body>
</html>
